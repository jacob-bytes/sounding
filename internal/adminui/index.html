<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sounding · 管理</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --border:#334155; --fg:#f1f5f9; --muted:#94a3b8; --primary:#3b82f6; --danger:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; margin: 0 0 12px; font-weight: 600; color: var(--fg); display:flex; align-items:center; gap:8px; }
  .card h2 span { color: var(--muted); font-weight: 400; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 12px; }
  td { padding: 7px 8px; border-bottom: 1px solid rgba(51,65,85,.5); }
  tr:last-child td { border-bottom: none; }
  code { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  input, select { background:#0b1220; border:1px solid var(--border); color:var(--fg); border-radius:6px; padding:7px 9px; font-size:13px; width:100%; }
  input:focus, select:focus { outline:none; border-color: var(--primary); }
  button { background: var(--primary); color:#fff; border:none; border-radius:6px; padding:8px 14px; font-size:13px; cursor:pointer; font-weight:500; }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; border:1px solid var(--border); color: var(--muted); }
  button.danger { background: transparent; border:1px solid var(--danger); color: var(--danger); padding:4px 10px; font-size:12px; }
  .row { display:grid; grid-template-columns: 1fr 1fr 1fr auto; gap:10px; align-items:end; }
  .row4 { display:grid; grid-template-columns: 2fr 1fr 1fr auto; gap:10px; align-items:end; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .tag { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; border:1px solid var(--border); color:var(--muted); }
  .tag.on { border-color: var(--primary); color: var(--primary); }
  .muted { color: var(--muted); }
  .status { font-size:12px; color: var(--muted); margin-left: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>sounding 管理</h1>
  <div class="sub">分布式探针主控 · <span id="stat">加载中…</span></div>

  <div class="card">
    <h2>节点 <span id="nodeCount"></span></h2>
    <table id="nodes"><thead><tr><th>名称</th><th>UUID</th><th>区域</th><th>状态</th><th>CPU</th><th>内存</th><th>温度</th><th></th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h2>添加节点 <span>手动登记（Agent 上报也会自动注册）</span></h2>
    <div class="row4">
      <div><label>UUID</label><input id="n-uuid" placeholder="node-01"></div>
      <div><label>名称</label><input id="n-name" placeholder="东京节点"></div>
      <div><label>区域</label><input id="n-region" placeholder="JP"></div>
      <button onclick="addNode()">添加</button>
    </div>
    <div class="status" id="node-status"></div>
  </div>

  <div class="card">
    <h2>探针任务 <span>client=* 为全局，否则为节点级</span></h2>
    <table id="probes"><thead><tr><th>归属</th><th>类型</th><th>名称</th><th>目标</th><th>状态</th><th></th></tr></thead><tbody></tbody></table>
    <div class="row" style="margin-top:12px; grid-template-columns: 1fr 1fr 1fr 1.2fr auto">
      <div><label>归属 client</label><input id="p-client" value="*"></div>
      <div><label>类型</label>
        <select id="p-type">
          <option value="icmp">icmp（延迟）</option>
          <option value="tcp">tcp（端口）</option>
          <option value="http">http（状态码）</option>
          <option value="dns">dns（解析）</option>
        </select>
      </div>
      <div><label>名称</label><input id="p-name" placeholder="上海移动"></div>
      <div><label>目标</label><input id="p-target" placeholder="223.5.5.5 / https://x.com / a.com@8.8.8.8"></div>
      <button onclick="addProbe()">添加探针</button>
    </div>
    <div class="status" id="probe-status"></div>
  </div>

  <div class="card">
    <h2>告警规则 <span>kind: offline / latency / loss</span></h2>
    <table id="alerts"><thead><tr><th>类型</th><th>节点</th><th>阈值</th><th></th></tr></thead><tbody></tbody></table>
    <div class="row4" style="margin-top:12px">
      <div><label>类型</label>
        <select id="a-kind"><option value="offline">offline（离线）</option><option value="latency">latency（延迟 ms）</option><option value="loss">loss（丢包 %）</option></select>
      </div>
      <div><label>节点（*=全部）</label><input id="a-node" value="*"></div>
      <div><label>阈值</label><input id="a-threshold" type="number" value="200"></div>
      <button onclick="addAlert()">添加规则</button>
    </div>
    <div class="status" id="alert-status"></div>
  </div>
</div>
<script>
const TOKEN_KEY = 'sounding-admin-token';
function token() { return localStorage.getItem(TOKEN_KEY) || ''; }
function api(path, opts = {}) {
  opts.headers = Object.assign({ 'X-Admin-Token': token(), 'Content-Type': 'application/json' }, opts.headers || {});
  return fetch(path, opts).then(async r => {
    if (r.status === 401) { const t = prompt('管理 Token：'); if (t) { localStorage.setItem(TOKEN_KEY, t); return api(path, opts); } throw new Error('unauthorized'); }
    return r.json();
  });
}
async function loadNodes() {
  try {
    const d = await api('/api/admin/nodes');
    const rows = Object.entries(d.nodes || {});
    document.querySelector('#nodes tbody').innerHTML = rows.map(([uuid, n]) => {
      const st = (d.statuses && d.statuses[uuid]) || {};
      const cpu = st.cpu != null ? st.cpu.toFixed(1) + '%' : '—';
      const ram = st.ram != null ? (st.ram / 1073741824).toFixed(1) + ' GB' : '—';
      const temp = st.temp ? st.temp.toFixed(1) + '°C' : '—';
      return `<tr><td>${n.name || '—'}</td><td><code>${uuid}</code></td><td>${n.region || '—'}</td>
        <td>${st.online ? '<span class="tag on">在线</span>' : '<span class="tag">离线</span>'}</td><td><code>${cpu}</code></td><td><code>${ram}</code></td><td><code>${temp}</code></td>
        <td><button class="danger" onclick="delNode('${uuid}')">删除</button></td></tr>`;
    }).join('') || '<tr><td colspan="8" class="muted">暂无节点</td></tr>';
    document.getElementById('nodeCount').textContent = rows.length + ' 台';
    document.getElementById('stat').textContent = '运行中 · ' + rows.length + ' 节点';
  } catch (e) { document.getElementById('stat').textContent = '需要管理 Token'; }
}
async function loadProbes() {
  try {
    const d = await api('/api/admin/probes');
    document.querySelector('#probes tbody').innerHTML = (d.probes || []).map(p =>
      `<tr><td><code>${p.client}</code></td><td><code>${p.type || 'icmp'}</code></td><td>${p.name}</td><td><code>${p.target}</code></td>
       <td>${p.enabled ? '<span class="tag on">启用</span>' : '<span class="tag">停用</span>'}</td>
       <td><button class="ghost" onclick="toggleProbe('${p.client}','${p.name}','${p.target}','${p.type || 'icmp'}',${p.enabled})">${p.enabled ? '停用' : '启用'}</button>
           <button class="danger" onclick="delProbe('${p.client}','${p.name}')">删除</button></td></tr>`).join('')
      || '<tr><td colspan="6" class="muted">暂无探针</td></tr>';
  } catch (e) {}
}
async function loadAlerts() {
  try {
    const d = await api('/api/admin/alerts');
    document.querySelector('#alerts tbody').innerHTML = (d.rules || []).map(r =>
      `<tr><td>${r.kind}</td><td><code>${r.node}</code></td><td><code>${r.threshold}</code></td>
       <td><button class="danger" onclick="delAlert('${r.kind}','${r.node}')">删除</button></td></tr>`).join('')
      || '<tr><td colspan="4" class="muted">暂无规则</td></tr>';
  } catch (e) {}
}
async function addNode() {
  const uuid = document.getElementById('n-uuid').value.trim();
  const name = document.getElementById('n-name').value.trim();
  if (!uuid || !name) return;
  await api('/api/admin/nodes', { method: 'POST', body: JSON.stringify({ uuid, name, region: document.getElementById('n-region').value.trim() }) });
  document.getElementById('node-status').textContent = '✓ 已添加';
  loadNodes();
}
async function addProbe() {
  const client = document.getElementById('p-client').value.trim() || '*';
  const name = document.getElementById('p-name').value.trim();
  const target = document.getElementById('p-target').value.trim();
  if (!name || !target) return;
  await api('/api/admin/probes', { method: 'POST', body: JSON.stringify({ client, name, target, type: document.getElementById('p-type').value, enabled: true }) });
  document.getElementById('probe-status').textContent = '✓ 已添加';
  loadProbes();
}
async function delNode(uuid) {
  if (!confirm('删除节点 ' + uuid + ' 及其历史？')) return;
  await api('/api/admin/nodes', { method: 'DELETE', body: JSON.stringify({ uuid }) });
  loadNodes();
}
async function toggleProbe(client, name, target, type, enabled) {
  await api('/api/admin/probes', { method: 'POST', body: JSON.stringify({ client, name, target, type, enabled: !enabled }) });
  loadProbes();
}
async function delProbe(client, name) {
  await api('/api/admin/probes', { method: 'DELETE', body: JSON.stringify({ client, name }) });
  loadProbes();
}
async function addAlert() {
  await api('/api/admin/alerts', { method: 'POST', body: JSON.stringify({
    kind: document.getElementById('a-kind').value,
    node: document.getElementById('a-node').value.trim() || '*',
    threshold: Number(document.getElementById('a-threshold').value) || 0,
  }) });
  document.getElementById('alert-status').textContent = '✓ 已添加';
  loadAlerts();
}
async function delAlert(kind, node) {
  await api('/api/admin/alerts', { method: 'DELETE', body: JSON.stringify({ kind, node }) });
  loadAlerts();
}
loadNodes(); loadProbes(); loadAlerts();
setInterval(loadNodes, 10000);
</script>
</body>
</html>
