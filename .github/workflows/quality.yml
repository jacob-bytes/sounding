name: Code Quality

on:
  push:
    branches: [main]
    paths: ['  contracts/**', 'internal/**', 'cmd/**', 'go.mod', '.github/workflows/**', 'go.sum']
  pull_request:
  workflow_dispatch:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
