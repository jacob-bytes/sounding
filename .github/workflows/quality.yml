name: Code Quality

on:
  push:
    branches: [main]
    paths: ['internal/**', 'cmd/**', 'contracts/**', 'go.mod', 'go.sum', '.github/workflows/**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Build
        run: go build ./...
